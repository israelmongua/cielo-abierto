<!doctype html>

  <head>

    <title>Sistema solar · Cielo Abierto</title>
    <style>
      /* sistema-solar.css — interfaz del simulador (paleta Space Midnight de Cielo Abierto) */
      :root {
        --vacio: #030508;
        --cian: #00f0ff;
        --purpura: #9d4edd;
        --oro: #ffb703;
        --texto: #e6edf7;
        --tenue: #7d8aa3;
        --cristal: rgba(8, 14, 26, 0.62);
        --borde: rgba(0, 240, 255, 0.18);
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--vacio);
        color: var(--texto);
        font:
          14px/1.5 "Instrument Sans",
          system-ui,
          sans-serif;
        overflow: hidden;
      }
      #escena {
        position: fixed;
        inset: 0;
      }
      #escena canvas {
        display: block;
      }
      .capa-etiquetas {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      /* etiquetas de los astros */
      .etiqueta {
        font: 500 11px/1 var(--mono);
        color: #cfe4ff;
        text-shadow:
          0 0 6px #000,
          0 0 2px #000;
        white-space: nowrap;
        pointer-events: none;
      }
      .etiqueta.estrella,
      .etiqueta.planeta {
        font-size: 12.5px;
        color: #fff;
      }
      .etiqueta.luna {
        font-size: 10px;
        opacity: 0.72;
      }
      .etiqueta.cometa {
        color: #9fd4ff;
      }
      .etiqueta.enano,
      .etiqueta.asteroide {
        color: #aab6cb;
      }

      /* paneles de cristal */
      .panel {
        position: fixed;
        z-index: 5;
        background: var(--cristal);
        border: 1px solid var(--borde);
        border-radius: 14px;
        backdrop-filter: blur(14px) saturate(140%);
        box-shadow: 0 20px 60px -20px rgba(0, 240, 255, 0.2);
      }
      button,
      select,
      input {
        font: 500 12.5px var(--mono);
        color: var(--texto);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 0.45rem 0.75rem;
        cursor: pointer;
        transition:
          border-color 0.2s,
          background 0.2s;
      }
      button:hover,
      select:hover {
        border-color: var(--cian);
      }
      button.activo {
        background: rgba(0, 240, 255, 0.16);
        border-color: var(--cian);
        color: var(--cian);
      }
      select option {
        background: #0b1220;
      }
      input[type="datetime-local"] {
        cursor: text;
        color-scheme: dark;
      }

      .top {
        position: fixed;
        z-index: 5;
        top: 0;
        left: 0;
        right: 0;
        padding: 1rem 1.25rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
      }
      .top > * {
        pointer-events: auto;
      }
      .volver {
        color: var(--tenue);
        text-decoration: none;
        font: 500 13px var(--mono);
      }
      .volver:hover {
        color: var(--cian);
      }
      .reloj {
        text-align: right;
      }
      .reloj .mono {
        display: block;
        font: 11px var(--mono);
        color: var(--tenue);
      }
      .reloj strong {
        font: 600 1.15rem var(--mono);
        color: var(--cian);
        text-shadow: 0 0 16px rgba(0, 240, 255, 0.45);
      }

      #lista {
        top: 4.2rem;
        left: 1rem;
        bottom: 5.6rem;
        width: 200px;
        padding: 0.9rem;
        overflow-y: auto;
      }
      #lista h2 {
        font:
          600 0.95rem "Unbounded",
          sans-serif;
        margin: 0 0 0.5rem;
      }
      #items h3 {
        font: 500 10.5px var(--mono);
        color: var(--tenue);
        margin: 0.9rem 0 0.35rem;
      }
      #items button {
        display: block;
        width: 100%;
        text-align: left;
        margin-bottom: 3px;
        padding: 0.35rem 0.6rem;
        background: transparent;
        border-color: transparent;
        font-family: inherit;
        font-size: 13px;
      }
      #items button:hover {
        background: rgba(0, 240, 255, 0.08);
      }
      #items button.activo {
        background: rgba(0, 240, 255, 0.16);
        color: var(--cian);
      }

      #info {
        top: 4.2rem;
        right: 1rem;
        width: 320px;
        max-height: calc(100% - 10.5rem);
        overflow-y: auto;
        padding: 1.1rem 1.2rem;
      }
      #info.oculto {
        display: none;
      }
      #info h2 {
        font:
          600 1.5rem "Unbounded",
          sans-serif;
        margin: 0.5rem 0 0.8rem;
        letter-spacing: -0.02em;
      }
      #info .chip {
        font: 500 11px var(--mono);
        color: var(--cian);
        border: 1px solid var(--cian);
        border-radius: 99px;
        padding: 0.15rem 0.6rem;
      }
      #info .cerrar {
        position: absolute;
        top: 0.5rem;
        right: 0.6rem;
        border: 0;
        background: none;
        font-size: 1.3rem;
        padding: 0.1rem 0.5rem;
        color: var(--tenue);
      }
      #info dl {
        margin: 0;
      }
      #info dt {
        font: 11px var(--mono);
        color: var(--tenue);
        margin-top: 0.65rem;
      }
      #info dd {
        margin: 0;
        color: var(--texto);
      }
      #info .dato {
        margin: 1rem 0 0;
        padding-top: 0.8rem;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        color: #b5c1d6;
        font-size: 13px;
      }

      .controles {
        bottom: 1rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem 1.4rem;
        padding: 0.7rem 0.9rem;
        max-width: calc(100% - 2rem);
        justify-content: center;
      }
      .controles .grupo {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        align-items: center;
      }
      .ayuda {
        position: fixed;
        z-index: 4;
        bottom: 4.4rem;
        left: 0;
        right: 0;
        text-align: center;
        margin: 0;
        font: 11px var(--mono);
        color: var(--tenue);
        pointer-events: none;
        text-shadow: 0 0 6px #000;
      }

      /* pantalla de carga */
      #carga {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: var(--vacio);
        transition: opacity 0.8s;
      }
      #carga.listo {
        opacity: 0;
        pointer-events: none;
      }
      #carga .caja {
        text-align: center;
        width: min(360px, 80vw);
      }
      #carga h1 {
        font:
          700 2rem "Unbounded",
          sans-serif;
        margin: 0 0 0.5rem;
        letter-spacing: -0.03em;
      }
      #car-msg {
        font: 12px var(--mono);
        color: var(--tenue);
        min-height: 1.5em;
      }
      .barra-carga {
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 9px;
        overflow: hidden;
      }
      .barra-carga i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(
          90deg,
          var(--cian),
          var(--purpura),
          var(--oro)
        );
        transition: width 0.2s;
      }

      @media (max-width: 860px) {
        #lista {
          display: none;
        }
        #info {
          width: auto;
          left: 1rem;
          right: 1rem;
          top: auto;
          bottom: 8.5rem;
          max-height: 38%;
        }
        .ayuda {
          display: none;
        }
      }

      .error-shader {
        position: fixed;
        z-index: 30;
        left: 1rem;
        bottom: 6.5rem;
        max-width: 480px;
        margin: 0;
        padding: 0.6rem 0.8rem;
        background: rgba(120, 20, 20, 0.9);
        color: #fff;
        font: 11px var(--mono);
        border-radius: 8px;
        white-space: pre-wrap;
      }
      #car-msg code {
        color: var(--cian);
      }
    </style>

    <script>
      /* Diagnóstico: si algo falla al arrancar, lo dice aquí en vez de quedarse en «Preparando…» */
      function falla(titulo, detalle) {
        if (window.__listo) {
          console.error(titulo, detalle);
          return;
        } // si la escena ya cargó, un error menor no la tapa
        const m = document.getElementById("car-msg"),
          b = document.querySelector(".barra-carga");
        if (!m) return;
        m.style.color = "#ff7b7b";
        m.innerHTML = "<b>" + titulo + "</b><br>" + (detalle || "");
        if (b) b.style.display = "none";
      }
      addEventListener("DOMContentLoaded", () => {
        if (location.protocol === "file:")
          falla(
            "Abriste el archivo con doble clic",
            "Los módulos de JavaScript necesitan un servidor. Abre <code>http://localhost:8080/sistema-solar.html</code> con Spring en marcha, o ejecuta <code>python3 -m http.server 8000</code> en esta carpeta y abre <code>http://localhost:8000/sistema-solar.html</code>.",
          );
        const c = document.createElement("canvas");
        if (!(c.getContext("webgl2") || c.getContext("webgl")))
          falla(
            "Tu navegador no tiene WebGL",
            "Activa la aceleración por hardware en los ajustes del navegador y revisa los drivers de la tarjeta gráfica.",
          );
      });
      addEventListener("error", (e) => {
        if (e.message && !/ResizeObserver/.test(e.message))
          falla(
            "Error de JavaScript",
            e.message +
              (e.filename
                ? "<br><small>" +
                  e.filename.split("/").pop() +
                  ":" +
                  e.lineno +
                  "</small>"
                : ""),
          );
      });
      addEventListener("unhandledrejection", (e) =>
        falla(
          "Error al iniciar",
          String((e.reason && e.reason.message) || e.reason),
        ),
      );
    </script>

      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";

      import {
        CSS2DRenderer,
        CSS2DObject,
      } from "three/addons/renderers/CSS2DRenderer.js";

      /* ===== astro.js ===== */
      const _astro = (() => {
        /* astro.js — mecánica orbital. Sin dependencias ni DOM (se puede probar en Node).
   Cada cuerpo se describe con elementos keplerianos y la posición se calcula resolviendo la
   ecuación de Kepler. Para los planetas se usan los elementos aproximados de Standish (JPL,
   válidos 1800–2050); para el resto, elementos orbitales publicados. Resultado: posiciones
   aproximadas, no efemérides de precisión. */
        const TAU = Math.PI * 2,
          D2R = Math.PI / 180;
        const J2000_MS = Date.UTC(2000, 0, 1, 12); // 1 enero 2000, 12:00 UTC
        const diasDesdeJ2000 = (ms) => (ms - J2000_MS) / 86400000;
        const fechaDesdeDias = (d) => new Date(J2000_MS + d * 86400000);

        // Ecuación de Kepler  E - e·sin(E) = M  (método de Newton)
        function kepler(M, e) {
          M = ((M % TAU) + TAU) % TAU;
          let E = e < 0.8 ? M : Math.PI;
          for (let k = 0; k < 60; k++) {
            const dE = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
            E -= dE;
            if (Math.abs(dE) < 1e-12) break;
          }
          return E;
        }

        // Elementos: a (UA), e, i, O (nodo), y además
        //   planetas:  L (longitud media J2000), wp (long. del perihelio), Ld (grados por siglo)
        //   otros:     w (arg. del perihelio) y  M (anomalía media J2000) + P (días)  ó  T0 (día J2000 del perihelio) + P
        const argPeri = (o) => (o.Ld !== undefined ? o.wp - o.O : o.w);
        const periodoDias = (o) => o.P ?? (360 * 36525) / o.Ld;
        function anomaliaMedia(o, d) {
          // grados
          if (o.Ld !== undefined) return o.L + (o.Ld / 36525) * d - o.wp;
          const n = 360 / o.P;
          return o.T0 !== undefined ? n * (d - o.T0) : o.M + n * d;
        }
        function girar(o, x, y) {
          // plano orbital -> eclíptica
          const i = o.i * D2R,
            O = o.O * D2R,
            w = argPeri(o) * D2R;
          const cO = Math.cos(O),
            sO = Math.sin(O),
            cw = Math.cos(w),
            sw = Math.sin(w),
            ci = Math.cos(i),
            si = Math.sin(i);
          return {
            x: (cw * cO - sw * sO * ci) * x + (-sw * cO - cw * sO * ci) * y,
            y: (cw * sO + sw * cO * ci) * x + (-sw * sO + cw * cO * ci) * y,
            z: sw * si * x + cw * si * y,
          };
        }
        // Posición heliocéntrica (UA) en coordenadas de la eclíptica, el día d desde J2000
        function estado(o, d) {
          const E = kepler(anomaliaMedia(o, d) * D2R, o.e);
          const p = girar(
            o,
            o.a * (Math.cos(E) - o.e),
            o.a * Math.sqrt(1 - o.e * o.e) * Math.sin(E),
          );
          p.r = Math.hypot(p.x, p.y, p.z);
          return p;
        }
        // Puntos de la órbita completa (para dibujar la línea)
        function trayectoria(o, n = 360) {
          const b = Math.sqrt(1 - o.e * o.e),
            out = [];
          for (let k = 0; k < n; k++) {
            const E = (k / n) * TAU;
            out.push(
              girar(o, o.a * (Math.cos(E) - o.e), o.a * b * Math.sin(E)),
            );
          }
          return out;
        }

        return {
          J2000_MS,
          diasDesdeJ2000,
          fechaDesdeDias,
          kepler,
          periodoDias,
          anomaliaMedia,
          estado,
          trayectoria,
        };
      })();

      const _texturas = (() => {
        /* texturas.js — texturas procedurales: cada planeta se pinta con ruido 3D (sin costuras y sin imágenes
   externas). Todas las funciones reciben crear(w, h) -> canvas, así se pueden usar también fuera del navegador. */
        const TAU = Math.PI * 2;
        const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
        const suave = (a, b, x) => {
          const t = clamp((x - a) / (b - a));
          return t * t * (3 - 2 * t);
        };
        const mezcla = (a, b, t) => [
          a[0] + (b[0] - a[0]) * t,
          a[1] + (b[1] - a[1]) * t,
          a[2] + (b[2] - a[2]) * t,
        ];

        // ---- ruido de valor 3D + fbm (varias escalas sumadas) ----
        const h3 = (x, y, z) => {
          let h =
            Math.imul(x, 374761393) ^
            Math.imul(y, 668265263) ^
            Math.imul(z, 1274126177);
          h = Math.imul(h ^ (h >>> 13), 1274126177);
          return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
        };
        function ruido(x, y, z) {
          const xi = Math.floor(x),
            yi = Math.floor(y),
            zi = Math.floor(z),
            xf = x - xi,
            yf = y - yi,
            zf = z - zi;
          const u = xf * xf * (3 - 2 * xf),
            v = yf * yf * (3 - 2 * yf),
            w = zf * zf * (3 - 2 * zf),
            L = (a, b, t) => a + (b - a) * t;
          return L(
            L(
              L(h3(xi, yi, zi), h3(xi + 1, yi, zi), u),
              L(h3(xi, yi + 1, zi), h3(xi + 1, yi + 1, zi), u),
              v,
            ),
            L(
              L(h3(xi, yi, zi + 1), h3(xi + 1, yi, zi + 1), u),
              L(h3(xi, yi + 1, zi + 1), h3(xi + 1, yi + 1, zi + 1), u),
              v,
            ),
            w,
          );
        }
        function fbm(x, y, z, o = 5) {
          let s = 0,
            a = 0.5,
            f = 1,
            n = 0;
          for (let i = 0; i < o; i++) {
            s += a * ruido(x * f, y * f, z * f);
            n += a;
            a *= 0.5;
            f *= 2.02;
          }
          return s / n;
        }

        // cráteres: celdas con un punto aleatorio; el perfil es un cuenco con un borde elevado
        function crateres(x, y, z, esc) {
          x *= esc;
          y *= esc;
          z *= esc;
          const xi = Math.floor(x),
            yi = Math.floor(y),
            zi = Math.floor(z);
          let hgt = 0;
          for (let dx = -1; dx <= 1; dx++)
            for (let dy = -1; dy <= 1; dy++)
              for (let dz = -1; dz <= 1; dz++) {
                const cx = xi + dx,
                  cy = yi + dy,
                  cz = zi + dz,
                  s = h3(cx, cy, cz + 91);
                if (s < 0.45) continue; // no todas las celdas tienen cráter
                const d = Math.hypot(
                    cx + h3(cx, cy, cz) - x,
                    cy + h3(cy, cz, cx + 7) - y,
                    cz + h3(cz, cx, cy + 13) - z,
                  ),
                  t = d / (0.18 + 0.3 * s);
                hgt +=
                  (t < 1 ? (t * t - 1) * 0.7 : 0) +
                  Math.exp(-(((t - 1) * 5) ** 2)) * 0.35;
              }
          return hgt;

          const c = crateres(x, y, z, 5) + 0.6 * crateres(x, y, z, 12),
            n = fbm(x * 3, y * 3, z * 3, 4),
            g = clamp(0.55 * k + 0.3 * (n - 0.5) + 0.35 * c, 0, 1.3);

          mercurio: (x, y, z) => {

          luna: (x, y, z) => {

            const mar = suave(0.5, 0.62, fbm(x * 1.6 + 4, y * 1.6, z * 1.6, 4));
            return [
              ...mezcla(c, [c[0] * 0.45, c[1] * 0.45, c[2] * 0.5], mar),

          ceres: (x, y, z) => {
            const [c, h] = roca(x, y, z, [135, 132, 128]);

          io: (x, y, z) => {

              0.53,

            return [...mezcla(c, [165, 130, 100], fis * 0.5), h];
          },
          pluton: (x, y, z, lat, lon) => {

            let c = mezcla(

            const dl = Math.atan2(Math.sin(lon - 0.6), Math.cos(lon - 0.6)),

          venus: (x, y, z, lat) => {

            if (hielo > 0) {

            return [...c, alt];

          marte: (x, y, z, lat) => {

              osc = suave(0.52, 0.64, fbm(x * 1.5 + 5, y * 1.5, z * 1.5, 4)),

            c = mezcla(c, [96, 56, 44], osc * 0.75);
            c = mezcla(
              c,
              [c[0] * 0.8, c[1] * 0.8, c[2] * 0.8],
              clamp(-cr * 0.4),
            );

          jupiter: (x, y, z, lat, lon) => {

              [240, 226, 200],

          urano: (x, y, z, lat) => {

        // Pinta una textura recorriendo cada píxel como un punto de la esfera. Devuelve { color, bump }.
        function pintar(crear, w, h, fn, { bump = true, alfa = false } = {}) {
          const c = crear(w, h),
            ctx = c.getContext("2d"),
            im = ctx.createImageData(w, h);
          let bc, bctx, bim;
          if (bump) {
            bc = crear(w, h);
            bctx = bc.getContext("2d");
            bim = bctx.createImageData(w, h);
          }
          for (let y = 0; y < h; y++) {
            const lat = (0.5 - (y + 0.5) / h) * Math.PI,
              cl = Math.cos(lat),
              sl = Math.sin(lat);
            for (let x = 0; x < w; x++) {
              const lon = ((x + 0.5) / w) * TAU - Math.PI,
                r = fn(cl * Math.cos(lon), sl, cl * Math.sin(lon), lat, lon),
                i = (y * w + x) * 4;
              im.data[i] = r[0];
              im.data[i + 1] = r[1];
              im.data[i + 2] = r[2];
              im.data[i + 3] = alfa ? r[3] * 255 : 255;
              if (bim) {
                const v = clamp(r[3] ?? 0.5) * 255;
                bim.data[i] = bim.data[i + 1] = bim.data[i + 2] = v;
                bim.data[i + 3] = 255;
              }
            }
          }
          ctx.putImageData(im, 0, 0);
          if (bim) bctx.putImageData(bim, 0, 0);
          return { color: c, bump: bc };
        }
        const crearTextura = (crear, estilo, w = 1024, h = 512) =>
          pintar(crear, w, h, ESTILOS[estilo] || ESTILOS.luna, {
            bump: estilo !== "sol",
          });
        const crearNubes = (crear, w = 1024, h = 512) =>
          pintar(
            crear,
            w,
            h,
            (x, y, z) => {
              const n = fbm(x * 3 + 11, y * 4, z * 3, 6);
              return [255, 255, 255, suave(0.5, 0.75, n)];
            },
            { bump: false, alfa: true },
          ).color;

        // Anillos de Saturno: una tira radial con las divisiones de Cassini y Encke. u = 0 borde interior, u = 1 borde exterior.
        function crearAnillos(crear, w = 1024) {
          const c = crear(w, 4),
            ctx = c.getContext("2d"),
            im = ctx.createImageData(w, 4);
          for (let x = 0; x < w; x++) {
            const u = x / (w - 1),
              r = 1.24 + u * (2.27 - 1.24),
              rl = ruido(u * 140, 3.3, 1.1);
            let a = r < 1.53 ? 0.22 : r < 1.95 ? 0.88 : r < 2.03 ? 0.04 : 0.58; // anillo C, B, división de Cassini, A
            if (Math.abs(r - 2.21) < 0.008) a *= 0.1; // división de Encke
            a *= 0.62 + 0.55 * rl;
            const col = mezcla([188, 165, 130], [226, 208, 176], rl);
            for (let y = 0; y < 4; y++) {
              const i = (y * w + x) * 4;

              im.data[i + 1] = col[1];
              im.data[i + 2] = col[2];
              im.data[i + 3] = clamp(a) * 255;

          ctx.putImageData(im, 0, 0);

        function crearGlow(crear, n = 256) {

            ctx = c.getContext("2d"),
            g = ctx.createRadialGradient(n / 2, n / 2, 0, n / 2, n / 2, n / 2);

          g.addColorStop(0.15, "rgba(255,255,255,.55)");
          g.addColorStop(0.45, "rgba(255,255,255,.12)");

          ctx.fillStyle = g;
          ctx.fillRect(0, 0, n, n);

        // Fondo del cielo: banda de la Vía Láctea con polvo oscuro y miles de estrellas (mapa equirectangular)
        function crearViaLactea(crear, w = 2048, h = 1024) {
          const { color } = pintar(
            crear,
            w,
            h,
            (x, y, z, lat) => {
              const banda = Math.exp(-((lat / 0.2) ** 2)),
                n = fbm(x * 4, y * 8, z * 4, 6),
                polvo =
                  suave(0.38, 0.8, fbm(x * 14 + 3, y * 30, z * 14, 6)) * 0.85;
              const nucleo = Math.exp(-((Math.atan2(z, x) / 0.9) ** 2)) * banda,
                v = banda * (0.4 + 0.9 * n) * (1 - 0.6 * polvo) + nucleo * 0.3;
              const c = mezcla(
                [120, 140, 190],
                [255, 224, 185],
                clamp(nucleo * 1.4 + n * 0.3),
              );
              return [c[0] * v * 0.75, c[1] * v * 0.75, c[2] * v * 0.8, 0.5];
            },
            { bump: false },
          );
          const ctx = color.getContext("2d");
          for (let i = 0; i < 14000; i++) {
            const b = Math.random() ** 3,
              tono = Math.random(),
              col =
                tono < 0.2
                  ? "255,190,150"
                  : tono < 0.7
                    ? "255,255,255"
                    : "170,200,255";
            ctx.fillStyle = `rgba(${col},${0.25 + 0.75 * b})`;
            const s = 0.6 + 1.6 * b,
              enBanda = i % 2 === 0,
              gauss =
                (Math.random() + Math.random() + Math.random() - 1.5) *
                h *
                0.16;
            ctx.fillRect(
              Math.random() * w,
              enBanda ? h / 2 + gauss : Math.random() * h,
              s,
              s,
            );
          }
          return color;
        }

        return {
          crearTextura,
          crearNubes,
          crearAnillos,
          crearGlow,
          crearViaLactea,
        };
      })();

      const { estado, trayectoria, diasDesdeJ2000, fechaDesdeDias } = _astro;
      const { CUERPOS } = _datos;

      /* ===== sistema-solar.js ===== */
      /* sistema-solar.js — simulador del sistema solar con Three.js.
   Sol, 8 planetas, planetas enanos, asteroides, cometas con cola, lunas, cinturón principal, troyanos de Júpiter
   y cinturón de Kuiper. Las posiciones salen de la mecánica orbital de astro.js, avanzando una fecha simulada. */

      const $ = (s) => document.querySelector(s);

      const VELOCIDADES = [
        ["Tiempo real", 1 / 86400],
        ["1 min / s", 1 / 1440],
        ["1 hora / s", 1 / 24],
        ["1 día / s", 1],
        ["1 semana / s", 7],
        ["1 mes / s", 30.44],
        ["1 año / s", 365.25],
        ["10 años / s", 3652.5],
        ["100 años / s", 36525],

        orbitas: true,

      const escala = (r) => (sim.real ? r * 120 : 55 * Math.sqrt(r));

        const r = p.r ?? Math.hypot(p.x, p.y, p.z),

      Object.assign(controles, {

      escena.add(new THREE.AmbientLight(0x3a4a78, 0.55)); // un poco de luz ambiente para ver el lado nocturno
      escena.add(new THREE.PointLight(0xfff2e0, 3.6, 0, 0)); // el Sol, en el origen, sin atenuación

      // ---------- fondo: Vía Láctea y estrellas (siguen a la cámara: están «infinitamente» lejos) ----------
      const fondo = new THREE.Group();

      function crearFondo() {

          new THREE.SphereGeometry(30000, 64, 32),

            depthWrite: false,

        fondo.add(vl);
        const n = 16000,
          pos = new Float32Array(n * 3),
          col = new Float32Array(n * 3),
          c = new THREE.Color();
        for (let i = 0; i < n; i++) {
          const u = Math.random() * 2 - 1,
            a = Math.random() * TAU,
            s = Math.sqrt(1 - u * u),
            t = Math.random();
          pos.set(
            [28000 * s * Math.cos(a), 28000 * u, 28000 * s * Math.sin(a)],
            i * 3,
          );

            t < 0.2 ? 0.06 : t < 0.75 ? 0.6 : 0.1,
            t < 0.75 ? 0.25 : 0.6,
            0.55 + 0.45 * Math.random() ** 3,

          col.set([c.r, c.g, c.b], i * 3);

        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.BufferAttribute(pos, 3));

          g,
          new THREE.PointsMaterial({

            vertexColors: true,
            transparent: true,
            depthWrite: false,

      // ---------- shaders ----------
      const GLSL_RUIDO = `float h(vec3 p){ p = fract(p*0.3183099+.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float n(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x), mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x), mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y), f.z); }
float fbm(vec3 p){ float s=0., a=.5; for(int i=0;i<6;i++){ s+=a*n(p); p*=2.03; a*=.5; } return s; }`;
      const materialSol = () =>
        new THREE.ShaderMaterial({

          vertexShader: `varying vec3 vP; varying vec3 vN; void main(){ vP = position; vN = normalize(normalMatrix*normal); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
          fragmentShader: `uniform float t; varying vec3 vP; varying vec3 vN; ${GLSL_RUIDO}
    void main(){

      float m = fbm(p*2.2 - vec3(t*.08, 0.0, t*.03));                  // detalle fino
      float manchas = smoothstep(.62,.7, fbm(p*.9 + 7.0 + t*.01));     // manchas solares

        c.nodo.add(lab);
        c.etiqueta = div;
        if (c.orb) crearOrbita(c);
        if (c.lun) crearOrbitaLuna(c);
        if (c.cola) crearCola(c);
        cuerpos.push(c);
        porId[c.id] = c;
      }

      function crearOrbita(c) {
        // línea de la órbita completa (se recalcula al cambiar la escala)
        c.puntos = trayectoria(c.orb, c.grupo === "cometa" ? 1024 : 480);
        const g = new THREE.BufferGeometry();
        g.setAttribute(
          "position",
          new THREE.BufferAttribute(new Float32Array(c.puntos.length * 3), 3),
        );
        const color =
          c.grupo === "planeta"
            ? c.color
            : c.grupo === "cometa"
              ? "#4f8fe0"
              : "#7d8da6";
        c.linea = new THREE.LineLoop(
          g,
          new THREE.LineBasicMaterial({
            color,
            transparent: true,
            opacity: c.grupo === "planeta" ? 0.5 : 0.3,
          }),
        );
        c.linea.frustumCulled = false;
        escena.add(c.linea);
        colocarOrbita(c);
      }
      function colocarOrbita(c) {
        const a = c.linea.geometry.attributes.position,
          v = new THREE.Vector3();
        c.puntos.forEach((p, i) => {
          aEscena(p, v);
          a.setXYZ(i, v.x, v.y, v.z);
        });
        a.needsUpdate = true;
      }
      function crearOrbitaLuna(c) {
        const { r, inc } = c.lun,
          pts = [];
        for (let i = 0; i < 128; i++) {
          const t = (i / 128) * TAU;
          pts.push(
            new THREE.Vector3(
              r * Math.cos(t),
              r * Math.sin(t) * Math.sin(inc * D2R),
              -r * Math.sin(t) * Math.cos(inc * D2R),
            ),
          );
        }
        c.linea = new THREE.LineLoop(
          new THREE.BufferGeometry().setFromPoints(pts),
          new THREE.LineBasicMaterial({
            color: "#8899bb",
            transparent: true,
            opacity: 0.25,
          }),
        );
        porId[c.padre].nodo.add(c.linea);
      }

      // Cola de cometa: partículas que se alejan del Sol (azul = gas ionizado, amarilla = polvo, que se curva)
      function crearCola(c) {
        const n = 1200,
          pos = new Float32Array(n * 3),
          col = new Float32Array(n * 3),
          sem = [];
        for (let i = 0; i < n; i++) {
          const u = Math.random(),
            ion = i % 3 !== 0,
            f = (1 - u) ** 1.6,
            b = ion ? [0.4, 0.68, 1] : [1, 0.85, 0.6];
          col.set([b[0] * f, b[1] * f, b[2] * f], i * 3);
          sem.push({ u, ion, dx: gauss(), dy: gauss(), dz: gauss() });
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        g.setAttribute("color", new THREE.BufferAttribute(col, 3));
        const pts = new THREE.Points(
          g,
          new THREE.PointsMaterial({
            size: 0.55,
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          }),
        );
        pts.frustumCulled = false;
        escena.add(pts);
        const coma = new THREE.Sprite(
          new THREE.SpriteMaterial({
            map: glowTex,
            color: 0x9fd4ff,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0,
          }),
        );
        coma.scale.setScalar(7);
        c.nodo.add(coma);
        c.cola = { pts, sem, coma };
      }
      const _dir = new THREE.Vector3(),
        _lado = new THREE.Vector3(),
        _arriba = new THREE.Vector3(0, 1, 0);
      function actualizarCola(c) {
        const { pts, sem, coma } = c.cola,
          r = c.pAU.r,
          intensidad = THREE.MathUtils.clamp((4.5 - r) / 3.5, 0, 1),
          L = (sim.real ? 170 : 115) * intensidad;
        pts.visible = L > 0.5;
        coma.material.opacity = 0.85 * intensidad;
        if (!pts.visible) return;
        _dir.copy(c.nodo.position).normalize();
        _lado.crossVectors(_dir, _arriba).normalize(); // la cola apunta en dirección opuesta al Sol
        const a = pts.geometry.attributes.position;
        sem.forEach((s, i) => {
          const d = s.u * s.u * L,
            abre = d * (s.ion ? 0.012 : 0.07),
            curva = s.ion ? 0 : ((d * d) / Math.max(L, 1)) * 0.22;
          a.setXYZ(
            i,
            c.nodo.position.x + _dir.x * d + _lado.x * curva + s.dx * abre,
            c.nodo.position.y + _dir.y * d + _lado.y * curva + s.dy * abre,
            c.nodo.position.z + _dir.z * d + _lado.z * curva + s.dz * abre,
          );
        });
        a.needsUpdate = true;
      }

      // ---------- cinturones de asteroides (miles de rocas con forma irregular, instanciadas) ----------
      const cinturones = [],
        _m = new THREE.Matrix4(),
        _p = new THREE.Vector3(),
        _s = new THREE.Vector3();
      const keplerRapido = (M, e) => {
        let E = M + e * Math.sin(M);
        for (let k = 0; k < 4; k++)
          E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
        return E;
      };
      function crearCinturon({ n, gen, tam, color }) {
        const roca = new THREE.IcosahedronGeometry(1, 1),
          p = roca.attributes.position;
        for (let i = 0; i < p.count; i++) {
          const k =
            0.72 +
            ((0.5 *
              (((Math.sin(
                p.getX(i) * 127.1 + p.getY(i) * 311.7 + p.getZ(i) * 74.7,
              ) *
                43758.5453) %
                1) +
                1)) %
              1);
          p.setXYZ(i, p.getX(i) * k, p.getY(i) * k * 0.85, p.getZ(i) * k);
        }
        roca.computeVertexNormals();
        const im = new THREE.InstancedMesh(
          roca,
          new THREE.MeshStandardMaterial({
            color,
            roughness: 0.95,
            metalness: 0.05,
            flatShading: true,
          }),
          n,
        );
        im.frustumCulled = false;
        escena.add(im);
        const orb = [];
        for (let k = 0; k < n; k++) {
          const o = gen(),
            i = o.i,
            O = o.O,
            w = o.w,
            cO = Math.cos(O),
            sO = Math.sin(O),
            cw = Math.cos(w),
            sw = Math.sin(w),
            ci = Math.cos(i),
            si = Math.sin(i);
          Object.assign(o, {
            b: Math.sqrt(1 - o.e * o.e),
            n: TAU / (o.a ** 1.5 * 365.25),
            s: tam * (0.4 + Math.random() ** 3 * 1.8),
            A1: cw * cO - sw * sO * ci,
            A2: -sw * cO - cw * sO * ci,
            B1: cw * sO + sw * cO * ci,
            B2: -sw * sO + cw * cO * ci,
            C1: sw * si,
            C2: cw * si,
            q: new THREE.Quaternion().setFromEuler(
              new THREE.Euler(
                Math.random() * TAU,
                Math.random() * TAU,
                Math.random() * TAU,
              ),
            ),
          });
          orb.push(o);
        }
        cinturones.push({ im, orb });
      }
      function actualizarCinturon({ im, orb }, dias) {
        for (let k = 0; k < orb.length; k++) {
          const o = orb[k],
            E = keplerRapido(o.M + o.n * dias, o.e),
            x = o.a * (Math.cos(E) - o.e),
            y = o.a * o.b * Math.sin(E);
          const X = o.A1 * x + o.A2 * y,
            Y = o.B1 * x + o.B2 * y,
            Z = o.C1 * x + o.C2 * y,
            r = Math.hypot(X, Y, Z),
            f = escala(r) / r;
          _p.set(X * f, Z * f, -Y * f);
          _s.setScalar(o.s);
          _m.compose(_p, o.q, _s);
          im.setMatrixAt(k, _m);
        }
        im.instanceMatrix.needsUpdate = true;
      }
      const GAPS = [2.5, 2.82, 2.95, 3.27]; // huecos de Kirkwood: resonancias con Júpiter
      function crearCinturones() {
        crearCinturon({
          n: 9000,
          tam: 0.13,
          color: 0x9a9184,
          gen: () => {
            let a;
            do {
              a = 2.1 + (1.2 * (Math.random() + Math.random())) / 2;
            } while (GAPS.some((g) => Math.abs(a - g) < 0.03));
            return {
              a,
              e: Math.random() * 0.2,
              i: (Math.random() + Math.random() - 1) * 0.25,
              O: Math.random() * TAU,
              w: Math.random() * TAU,
              M: Math.random() * TAU,
            };
          },
        });
        for (const lado of [1, -1])
          crearCinturon({
            n: 1400,
            tam: 0.12,
            color: 0x80776c,
            gen: () => ({
              // troyanos de Júpiter: 60° delante y detrás
              a: 5.2029 + gauss() * 0.14,
              e: Math.random() * 0.1,
              i: Math.abs(gauss()) * 0.2,
              O: 100.47 * D2R,
              w: -85.74 * D2R,
              M: 19.67 * D2R + lado * 60 * D2R + gauss() * 0.3,
            }),
          });
        crearCinturon({
          n: 6000,
          tam: 0.5,
          color: 0x7f8fa6,
          gen: () => {
            // cinturón de Kuiper (incluye los plutinos, en resonancia 3:2)
            const plutino = Math.random() < 0.3;
            return {
              a: plutino ? 39.4 + gauss() * 0.4 : 42 + Math.random() * 7,
              e: plutino ? 0.12 + Math.random() * 0.12 : Math.random() * 0.12,
              i: Math.abs(gauss()) * 0.3,
              O: Math.random() * TAU,
              w: Math.random() * TAU,
              M: Math.random() * TAU,
            };
          },
        });
      }

      // ---------- actualización de posiciones en cada cuadro ----------
      const _tmp = new THREE.Vector3();
      function actualizar(dias, t) {
        for (const c of cuerpos) {
          if (c.orb) {
            c.pAU = estado(c.orb, dias);
            aEscena(c.pAU, c.nodo.position);
          } else if (c.lun) {
            // las lunas giran en torno a su planeta
            const th = (TAU * dias) / c.lun.P + c.lun.fase,
              r = c.lun.r;
            c.nodo.position.set(
              r * Math.cos(th),
              r * Math.sin(th) * Math.sin(c.lun.inc * D2R),
              -r * Math.sin(th) * Math.cos(c.lun.inc * D2R),
            );
            c.mesh.rotation.y = th;
            c.pAU = porId[c.padre].pAU; // rotación sincrónica: siempre muestran la misma cara
            continue;
          } else c.pAU = { x: 0, y: 0, z: 0, r: 0 };
          if (c.rot) c.mesh.rotation.y = (TAU * dias) / c.rot; // rotación propia
          if (c.capaNubes)
            c.capaNubes.rotation.y = ((TAU * dias) / c.rot) * 1.05;
          if (c.matAtm)
            c.matAtm.uniforms.sol.value
              .copy(c.nodo.position)
              .negate()
              .normalize();
          if (c.cola) actualizarCola(c);
          if (c.id === "sol") c.mesh.material.uniforms.t.value = t;
        }
        if (sim.cinturones)
          cinturones.forEach((b) => actualizarCinturon(b, dias));
        // las esferas de selección crecen con la distancia para que siempre se pueda hacer clic
        for (const c of cuerpos)
          c.pick.scale.setScalar(
            Math.max(
              1,
              (camara.position.distanceTo(c.nodo.getWorldPosition(_tmp)) *
                0.02) /
                c.pickBase,
            ),
          );
        for (const c of cuerpos)
          if (c.lun)
            c.etiqueta.style.display =
              sim.etiquetas &&
              camara.position.distanceTo(c.nodo.getWorldPosition(_tmp)) < 140
                ? ""
                : "none";
      }

      // ---------- cámara: seguir un astro y volar hasta él ----------
      let seguido = null,
        destino = null,
        irA = null,
        seleccion = null;
      const previa = new THREE.Vector3(),
        delta = new THREE.Vector3(),
        objetivoFoco = new THREE.Vector3();
      const distanciaFoco = (c) =>
        c.id === "sol"
          ? 70
          : c.grupo === "cometa"
            ? 8
            : Math.max(c.radio * 5, 3.5);
      function seleccionar(c) {
        seleccion = c;
        cuerpos.forEach((o) => {
          if (o.linea && o.orb)
            o.linea.material.opacity =
              o === c ? 1 : o.grupo === "planeta" ? 0.5 : 0.3;
        });
        document
          .querySelectorAll("#items button")
          .forEach((b) => b.classList.toggle("activo", b.dataset.id === c?.id));
        mostrarInfo(c);
      }
      function enfocar(c) {
        seleccionar(c);
        seguido = c;
        irA = null;
        destino = distanciaFoco(c);
        c.nodo.getWorldPosition(previa);
        objetivoFoco.copy(previa);
      }
      function vistaGeneral() {
        seguido = null;
        destino = null;
        irA = {
          pos: new THREE.Vector3(
            0,
            sim.real ? 4200 : 330,
            sim.real ? 7600 : 620,
          ),
          tgt: new THREE.Vector3(),
        };
      }
      function seguir() {
        if (seguido) {
          seguido.nodo.getWorldPosition(_tmp);
          delta.copy(_tmp).sub(previa);
          previa.copy(_tmp);
          camara.position.add(delta);
          controles.target.add(delta);
          controles.target.lerp(_tmp, 0.1); // acompaña al astro mientras se mueve
          if (destino !== null) {
            // acercamiento suave
            const off = camara.position.clone().sub(controles.target),
              L = off.length(),
              nl = L + (destino - L) * 0.07;
            camara.position.copy(controles.target).add(off.setLength(nl));
            if (Math.abs(nl - destino) < destino * 0.01) destino = null;
          }
        } else if (irA) {
          camara.position.lerp(irA.pos, 0.06);
          controles.target.lerp(irA.tgt, 0.06);
          if (camara.position.distanceTo(irA.pos) < irA.pos.length() * 0.005)
            irA = null;
        }
      }
      controles.addEventListener("start", () => {
        destino = null;
        irA = null;
      }); // si el usuario toma el control, se cancela la animación

      // ---------- selección con el mouse ----------
      const rayo = new THREE.Raycaster(),
        puntero = new THREE.Vector2();
      let pulsado = null;
      const bajo = (x, y) => {
        puntero.set((x / innerWidth) * 2 - 1, (-y / innerHeight) * 2 + 1);
        rayo.setFromCamera(puntero, camara);
        return rayo.intersectObjects(seleccionables, false)[0]?.object.userData
          .cuerpo;
      };
      renderer.domElement.addEventListener("pointerdown", (e) => {

      });
      renderer.domElement.addEventListener("pointerup", (e) => {
        if (
          pulsado &&
          Math.hypot(e.clientX - pulsado[0], e.clientY - pulsado[1]) < 5

        }

      });
      renderer.domElement.addEventListener("pointermove", (e) => {
        renderer.domElement.style.cursor = bajo(e.clientX, e.clientY)
          ? "pointer"
          : "";
      });

      // ---------- interfaz ----------
      const fmt = (n, d = 2) =>
        n.toLocaleString("es-CO", { maximumFractionDigits: d });
      const GRUPOS = {
        estrella: "Estrella",
        planeta: "Planeta",
        enano: "Planeta enano",
        asteroide: "Asteroide",
        cometa: "Cometa",
        luna: "Luna",
      };
      function mostrarInfo(c) {
        const panel = $("#info");
        if (!c) {
          panel.classList.add("oculto");
          return;
        }
        panel.classList.remove("oculto");
        panel.innerHTML = `<button class="cerrar" aria-label="Cerrar">×</button><span class="chip">${GRUPOS[c.grupo]}</span><h2>${c.nombre}</h2>
    <dl>${c.info.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}<div id="dinamico"></div></dl><p class="dato">${c.dato || ""}</p>`;
        panel.querySelector(".cerrar").onclick = () => {
          seleccion = null;
          panel.classList.add("oculto");
        };

      }
      function actualizarDinamico() {
        const c = seleccion,
          d = $("#dinamico");

        const p = c.pAU,
          T = porId.tierra.pAU,
          rSol = p.r,
          rTierra = Math.hypot(p.x - T.x, p.y - T.y, p.z - T.z);

          m < 90 ? `${fmt(m, 1)} min` : `${fmt(m / 60, 1)} h`;
        d.innerHTML = `<dt>Distancia al Sol (hoy)</dt><dd>${fmt(rSol, 3)} UA · luz: ${luz(rSol * 8.317)}</dd><dt>Distancia a la Tierra (hoy)</dt><dd>${fmt(rTierra, 3)} UA · luz: ${luz(rTierra * 8.317)}</dd>`;
      }
      function dibujarLista() {

          .map(

      }
      function pintarFecha() {

              .toISOString()

              .slice(0, 16) + " UTC",

      }
      function actualizarTiempo() {

        $("#btn-pausa").textContent = sim.pausa ? "▶" : "❚❚";
        $("#btn-reversa").classList.toggle("activo", sim.reversa);

          $(`[data-t="${k}"]`).classList.toggle("activo", sim[k]);

          ? "Distancias reales"
          : "Distancias comprimidas";
      }
      function alternar(k) {
        sim[k] = !sim[k];
        if (k === "orbitas")
          cuerpos.forEach((c) => {
            if (c.linea) c.linea.visible = sim.orbitas;

        if (k === "etiquetas")
          cuerpos.forEach((c) => {
            c.etiqueta.style.display = sim.etiquetas ? "" : "none";
          });
        if (k === "cinturones")
          cinturones.forEach((b) => {

      }
      function iniciarInterfaz() {
        $("#vel").innerHTML = VELOCIDADES.map(
          ([t], i) => `<option value="${i}">${t}</option>`,

        $("#vel").value = sim.vel;
        $("#vel").onchange = (e) => {
          sim.vel = +e.target.value;
        };
        $("#btn-pausa").onclick = () => {

        $("#btn-reversa").onclick = () => {

          b.onclick = () => alternar(b.dataset.t);

        addEventListener("keydown", (e) => {
          if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;

      // ---------- bucle principal y arranque ----------

      }
      const respiro = () => new Promise((r) => setTimeout(r, 0));
      async function iniciar() {
        const barra = $("#progreso"),
          msg = $("#car-msg");
        glowTex = tex(crearGlow(crear));
        msg.textContent = "Pintando el cielo…";
        crearFondo();
        await respiro();
        for (let i = 0; i < CUERPOS.length; i++) {
          // los planetas se pintan uno a uno, con ruido procedural
          msg.textContent = `Pintando ${CUERPOS[i].nombre}…`;
          barra.style.width = (i / CUERPOS.length) * 100 + "%";
          await respiro();
          construir(CUERPOS[i]);
        }
        msg.textContent = "Esparciendo asteroides…";
        barra.style.width = "100%";
        await respiro();
        crearCinturones();
        dibujarLista();
        iniciarInterfaz();
        camara.position.set(0, 330, 620);
        controles.target.set(0, 0, 0);
        actualizar(sim.dias, 0);
        actualizarTiempo();
        window.__listo = true;
        $("#carga").classList.add("listo");
        bucle();
      }
      window.sistemaSolar = {
        sim,
        cuerpos,
        porId,
        enfocar,
        vistaGeneral,
        alternar,
        camara,
        controles,
      }; // para depurar desde la consola
      iniciar().catch((e) => {
        console.error(e);
        window.falla?.("Error al iniciar", String(e.message || e));
      });
    </script>
  </body>
</html>
